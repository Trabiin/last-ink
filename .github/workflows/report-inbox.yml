# Report inbox (issue #146, #175, docs/FEEDBACK.md): tests the Cloudflare Worker on every change to it, and
# deploys it on main once the optional Cloudflare secrets exist. Without them the deploy step is skipped and
# the worker is updated by pasting worker.js into the Cloudflare dashboard, as in docs/FEEDBACK.md.
#   Repo secrets for auto-deploy: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template), CLOUDFLARE_ACCOUNT_ID.
# The worker's GITHUB_TOKEN secret lives only in Cloudflare; a deploy keeps it.
name: Report inbox

on:
  push:
    branches: [main]
    paths: ["tools/feedback_worker/**", ".github/workflows/report-inbox.yml"]
  pull_request:
    paths: ["tools/feedback_worker/**", ".github/workflows/report-inbox.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker tests
        run: node tools/feedback_worker/test.mjs

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE == 'true'
        working-directory: tools/feedback_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Deploy skipped
        if: github.event_name != 'pull_request' && env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret, so the worker was not deployed. Paste tools/feedback_worker/worker.js into the Cloudflare dashboard (docs/FEEDBACK.md)."
